name: Deploy sito su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Pubblica demo Cirispaccio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Link da condividere
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
          V: ${{ github.run_number }}
        run: |
          {
            echo "## Sito online — versione $V"
            echo ""
            echo "**Link da condividere (sempre aggiornato):** ${URL}?v=${V}"
            echo ""
            echo "- Italiano: ${URL}?v=${V}&lang=it"
            echo "- English: ${URL}?v=${V}&lang=en"
          } >> "$GITHUB_STEP_SUMMARY"
